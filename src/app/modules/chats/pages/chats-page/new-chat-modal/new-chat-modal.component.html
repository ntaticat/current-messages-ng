<div
  class="fixed inset-0 flex items-center justify-center z-50"
  style="
    background: rgba(8, 5, 3, 0.92);
    background-image: repeating-linear-gradient(
      45deg,
      rgba(180, 90, 48, 0.06) 0px,
      rgba(180, 90, 48, 0.06) 1px,
      transparent 1px,
      transparent 12px
    );
  "
>
  <div
    class="w-[360px] rounded-sm overflow-hidden relative"
    style="
      background: #161210;
      border: 0.5px solid rgba(180, 90, 48, 0.25);
      font-family: &quot;DM Sans&quot;, sans-serif;
    "
  >
    <!-- Franja decorativa -->
    <div
      class="h-1 w-full"
      style="
        background: linear-gradient(
          90deg,
          #b45a30 0%,
          #d4841c 33%,
          #b45a30 66%,
          #7c2020 100%
        );
      "
    ></div>

    <!-- Encabezado -->
    <div
      class="px-7 pt-7 pb-5 relative"
      style="border-bottom: 0.5px solid rgba(255, 255, 255, 0.06)"
    >
      <span
        class="text-[11px] font-medium tracking-[0.18em] uppercase"
        style="color: #c46a38"
      >
        Nuevo chat
      </span>
      <h2
        class="mt-1.5 mb-1 text-[22px] font-normal leading-snug"
        style="font-family: &quot;Playfair Display&quot;, serif; color: #f0eae4"
      >
        Dale una identidad
      </h2>
      <p class="text-[13px] font-light m-0" style="color: #7a6e68">
        Nombra tu conversación para encontrarla después
      </p>
      <span
        class="absolute top-5 right-6 text-[48px] leading-none select-none"
        style="color: #d4841c; opacity: 0.12"
        >✦</span
      >
    </div>

    <!-- Cuerpo -->
    <div class="px-7 py-6">
      <label
        class="block text-[11px] font-medium tracking-[0.12em] uppercase mb-2"
        style="color: #5a524e"
      >
        Nombre del chat
      </label>
      <input
        type="text"
        #chatInput
        placeholder="Ej: Proyecto Alpha..."
        autocomplete="off"
        class="w-full text-[14px] font-light rounded-sm px-3.5 py-2.5 outline-none transition-all duration-200 placeholder:italic"
        style="
          background: #0e0c0a;
          color: #e8ddd6;
          border: 0.5px solid rgba(255, 255, 255, 0.08);
          placeholder-color: #3a3330;
        "
        (focus)="
          $event.target.style.borderColor = '#B45A30';
          $event.target.style.boxShadow = '0 0 0 2px rgba(180,90,48,0.15)'
        "
        (blur)="
          $event.target.style.borderColor = 'rgba(255,255,255,0.08)';
          $event.target.style.boxShadow = 'none'
        "
      />
    </div>

    <!-- Pie -->
    <div
      class="px-7 pb-6 pt-4 flex justify-end gap-2.5"
      style="border-top: 0.5px solid rgba(255, 255, 255, 0.06)"
    >
      <button
        (click)="closeModal()"
        class="px-[18px] py-2 text-[13px] font-normal tracking-wide rounded-sm bg-transparent transition-all duration-150"
        style="color: #7a6e68; border: 0.5px solid rgba(255, 255, 255, 0.1)"
      >
        Cancelar
      </button>
      <button
        (click)="onSubmitChat(chatInput.value)"
        class="px-[22px] py-2 text-[13px] font-medium tracking-[0.1em] uppercase rounded-sm transition-all duration-150 active:scale-[0.98]"
        style="background: #b45a30; color: #fff5ee; border: none"
      >
        Crear
      </button>
    </div>
  </div>
</div>

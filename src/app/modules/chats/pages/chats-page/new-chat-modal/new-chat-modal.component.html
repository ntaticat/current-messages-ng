<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
  <div class="relative w-full max-w-[380px] overflow-hidden rounded-2xl border border-[#f0a500]/20 bg-gradient-to-br from-[#3d2010] to-[#2a1a0e] shadow-xl font-sans">
    <!-- Textura, igual que las tarjetas de chat -->
    <div
      class="pointer-events-none absolute inset-0 opacity-[0.04]"
      style="background-image: radial-gradient(circle at 20% 20%, #f0a500 0%, transparent 60%);"
    ></div>

    <!-- Encabezado -->
    <div class="relative border-b border-[#f0a500]/12 px-6 pt-6 pb-4">
      <p class="text-[10px] uppercase tracking-[0.12em] text-[#f0a500]/60">Nuevo chat</p>
      <h2 class="mt-1 font-display text-xl font-bold text-[#f5ede0]">Dale una identidad</h2>
      <p class="mt-1 text-[12px] leading-relaxed text-[#f5ede0]/45">
        Este nombre solo te ayuda a encontrar la conversación en tu lista.
      </p>
    </div>

    <!-- Cuerpo -->
    <div class="relative px-6 py-5">
      <label class="mb-2 block text-[11px] uppercase tracking-[0.1em] text-[#f0a500]/50">
        Nombre del chat
      </label>
      <input
        type="text"
        #chatInput
        placeholder="Ej: Proyecto Alpha"
        autocomplete="off"
        [disabled]="isLoading"
        (keyup.enter)="onSubmitChat(chatInput.value)"
        (input)="errorMessage = null"
        class="w-full rounded-xl border px-3.5 py-2.5 text-[14px] font-light text-[#e8ddd6] outline-none transition-colors placeholder:italic placeholder:text-[#3a3330] disabled:opacity-50"
        [style.background]="'#0e0c0a'"
        [style.borderColor]="errorMessage ? '#c0392b' : 'rgba(255,255,255,0.08)'"
      />
      @if (errorMessage) {
        <p class="mt-1.5 text-[11px] text-[#e0685a]">{{ errorMessage }}</p>
      }

      <!-- Ejemplos: dejan claro que es un nombre libre -->
      <div class="mt-3 flex flex-wrap gap-1.5">
        @for (ejemplo of nombresSugeridos; track ejemplo) {
          <button
            type="button"
            (click)="chatInput.value = ejemplo; chatInput.focus(); errorMessage = null"
            class="rounded-full border border-[#f0a500]/20 bg-[#f0a500]/5 px-2.5 py-1 text-[11px] text-[#f0a500]/70 transition-colors hover:bg-[#f0a500]/12"
          >
            {{ ejemplo }}
          </button>
        }
      </div>
    </div>

    <!-- Pie -->
    <div class="relative flex justify-end gap-2 border-t border-[#f0a500]/12 px-6 py-4">
      <button
        (click)="closeModal()"
        [disabled]="isLoading"
        class="rounded-lg px-4 py-2 text-[13px] text-[#f5ede0]/50 transition-colors hover:bg-white/5 disabled:opacity-40"
      >
        Cancelar
      </button>
      <button
        (click)="onSubmitChat(chatInput.value)"
        [disabled]="isLoading"
        class="rounded-lg bg-[#1a6b3c] px-4 py-2 text-[13px] font-bold uppercase tracking-[0.06em] text-white transition-colors hover:bg-[#145c32] active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isLoading ? 'Creando...' : 'Crear' }}
      </button>
    </div>
  </div>
</div>

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
  <div class="w-full max-w-[380px] rounded-md border border-[#3d3425] bg-[#1e1a12]">
    <!-- Encabezado -->
    <div class="border-b border-[#3d3425] px-6 pt-6 pb-4">
      <h2 class="font-display text-[16px] font-bold tracking-[0.04em] text-[#d4b06a]">
        Invitar al chat
      </h2>
      <p class="mt-1 text-[13px] text-[rgba(212,201,168,0.5)]">
        Introduce el identificador del usuario a invitar
      </p>
    </div>

    <!-- Cuerpo -->
    <div class="px-6 py-5">
      <label for="uuid" class="mb-1.5 block text-[11px] tracking-[0.06em] text-[rgba(212,201,168,0.4)]">
        ID de usuario
      </label>
      <input
        type="text"
        id="uuid"
        #userInput
        placeholder="123e4567-e89b-12d3-a456-426614174000"
        spellcheck="false"
        [disabled]="isLoading"
        class="w-full rounded-md border border-[#3d3425] bg-[#130f09] px-3.5 py-2.5 font-body text-[14px] text-[#d4c9a8] outline-none transition-colors placeholder:italic placeholder:text-[rgba(212,201,168,0.2)] focus:border-[#2d5c3a] disabled:opacity-50"
      />
      <p class="mt-2 text-[11px] text-[rgba(212,201,168,0.3)]">
        Debe ser el identificador de otro usuario registrado
      </p>
    </div>

    <!-- Pie -->
    <div class="flex justify-end gap-2 border-t border-[#3d3425] px-6 py-4">
      <button
        (click)="closeModal()"
        [disabled]="isLoading"
        class="rounded-md px-4 py-2 text-[13px] text-[rgba(212,201,168,0.6)] transition-colors hover:bg-[#3d3425] disabled:opacity-40"
      >
        Cancelar
      </button>
      <button
        (click)="onSubmitAddParticipant(userInput.value)"
        [disabled]="isLoading"
        class="rounded-md bg-[#2d5c3a] px-4 py-2 text-[13px] font-medium text-[#a8d5b5] transition-colors hover:bg-[#3d7a4e] disabled:cursor-not-allowed disabled:opacity-40"
      >
        {{ isLoading ? 'Invitando...' : 'Invitar' }}
      </button>
    </div>
  </div>
</div>
